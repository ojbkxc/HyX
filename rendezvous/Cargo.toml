[package]
name = "hyx-rendezvous"
version = "0.1.0"
edition = "2021"
authors = ["ojbkxc"]
description = "Pairing-by-code rendezvous server + client for HyX"
license = "MIT"

[lib]
name = "hyx_rendezvous"
path = "src/lib.rs"

[[bin]]
name = "rendezvousd"
path = "src/bin/rendezvousd.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.12"
