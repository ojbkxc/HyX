[package]
name = "hyx-cli"
version = "0.1.0"
edition = "2021"
authors = ["ojbkxc"]
description = "CLI interface for HyX file transfer"
license = "MIT"

[features]
# Expunged GUI build (upstream: Iced). The feature is declared so the
# `#[cfg(feature = "gui")]` scaffolding still type-checks under `-D warnings`.
gui = []

[dependencies]
hyx-core = { path = "../core" }
hyx-rendezvous = { path = "../rendezvous" }
tokio = { version = "1.40", features = ["full", "signal"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"
anyhow = "1.0"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
console = "0.15"
dialoguer = "0.11"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.12"