[package]
name = "hyx-core"
version = "1.0.0"
edition = "2021"
authors = ["ojbkxc"]
description = "HyX fusion transport core"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"  # MessagePack serialization
zstd = "0.13"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
bitvec = { version = "1.0", features = ["serde"] }
bytes = "1.7"
tracing = "0.1.41"
serde_json = "1.0.145"
rand = "0.8"
dirs = "5.0"
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
indicatif = "0.17"  # ProgressState UI hooks (TODO: move to hyx-cli via callback)

# QUIC transport (TLS 1.3 mandatory) + cert-pinned identity.
# rcgen owns the Ed25519 keypair material so we don't need ed25519-dalek directly.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rcgen = "0.13"
hyx-rendezvous = { path = "../rendezvous" }

# UDP 发现端口需要 SO_REUSEADDR，避免监听 + 发送同时绑定 14566 时端口冲突。
socket2 = { version = "0.5", features = ["all"] }
# 枚举网络接口，用于 UDP 多播 join_multicast_v4 时挑选合适的发送接口。
if-addrs = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"
