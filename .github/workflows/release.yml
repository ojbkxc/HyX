name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)，留空则从 pubspec.yaml 读取'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 读取版本号（来自 pubspec.yaml 或 workflow_dispatch 输入）
  # ─────────────────────────────────────────────────────────────
  build:
    # 排除 v2.0.0：该 tag 由 prerelease.yml 维护，不触发正式 release
    if: github.ref_name != 'v2.0.0'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
            TAG_VERSION="v$VERSION"
          fi
          VERSION=${TAG_VERSION#v}
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION (tag: $TAG_VERSION)"

  # ─────────────────────────────────────────────────────────────
  # Android APK（split-per-abi，ubuntu-22.04）
  # ─────────────────────────────────────────────────────────────
  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 复制文件到 $APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust（Android target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android

      - name: 检查 rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 更新 Gradle 版本
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.13-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: 依赖
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: dart run slang

      - name: 构建 APK（arm64）
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --target-platform android-arm64 --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk

  # ─────────────────────────────────────────────────────────────
  # Android APK 轻量版（Kotlin + Rust JNI，无 Flutter 引擎，arm64）
  # ─────────────────────────────────────────────────────────────
  build_apk_lite:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 配置 Android NDK（使用 runner 预装）
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/*/ | head -1)
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_PATH=${NDK_PATH}"
          ls "${NDK_PATH}"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 构建 APK 轻量版
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 上传 APK 轻量版
        uses: actions/upload-artifact@v4
        with:
          name: apk-lite-result
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Linux x86_64 tar.gz（ubuntu-22.04）
  # ─────────────────────────────────────────────────────────────
  build_tar_x86_64:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 Linux
        working-directory: app
        run: flutter build linux --release

      - name: 创建 tar.gz 归档
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czvf ../../../../../result.tar.gz *

      - name: 上传 tar.gz 归档
        uses: actions/upload-artifact@v4
        with:
          name: tar-gz-x86-64-result
          path: ./app/*.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Linux arm64 tar.gz（ubuntu-22.04-arm）
  # ─────────────────────────────────────────────────────────────
  build_tar_arm_64:
    needs: build
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      # Flutter 不提供 Linux ARM64 预编译二进制，从 GitHub 克隆 SDK
      - name: 安装 Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter --version

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 Linux
        working-directory: app
        run: flutter build linux --release

      - name: 创建 tar.gz 归档
        run: |
          cd app/build/linux/arm64/release/bundle
          tar -czvf ../../../../../result.tar.gz *

      - name: 上传 tar.gz 归档
        uses: actions/upload-artifact@v4
        with:
          name: tar-gz-arm-64-result
          path: ./app/*.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Linux deb 包（ubuntu-22.04）
  # ─────────────────────────────────────────────────────────────
  build_deb_x86_64:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 启用 flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: 更新 PATH
        run: echo 'export PATH="$PATH:$HOME/.pub-cache/bin"' >> ~/.bashrc

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 创建 deb 打包配置
        working-directory: app
        run: |
          mkdir -p linux/packaging/deb
          cp ../support/build/deb/make_config.yaml linux/packaging/deb/make_config.yaml

      - name: 构建 deb 包
        working-directory: app
        run: PATH="$PATH:$HOME/.pub-cache/bin" flutter_distributor package --platform linux --targets deb

      - name: 查找 deb 文件
        id: find_deb
        run: |
          VERSION=${{ needs.build.outputs.version }}
          DEB_PATH=$(find app/dist -name "hyx_app-$VERSION*-linux.deb" -o -name "hyx_app-*.deb" | head -1)
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT

      - name: 检查 deb 文件是否存在
        run: |
          if [[ ! -f "${{ steps.find_deb.outputs.deb_path }}" ]]; then
            echo "未找到文件: ${{ steps.find_deb.outputs.deb_path }}"
            exit 1
          fi

      - name: 上传 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: deb-x86-64-result
          path: ${{ steps.find_deb.outputs.deb_path }}

  # ─────────────────────────────────────────────────────────────
  # Linux arm64 deb 包（ubuntu-22.04-arm）
  # ─────────────────────────────────────────────────────────────
  build_deb_arm_64:
    needs: build
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      # Flutter 不提供 Linux ARM64 预编译二进制，从 GitHub 克隆 SDK
      - name: 安装 Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter --version

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 启用 flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 创建 deb 打包配置
        working-directory: app
        run: |
          mkdir -p linux/packaging/deb
          cp ../support/build/deb/make_config.yaml linux/packaging/deb/make_config.yaml

      - name: 构建 deb 包
        working-directory: app
        run: PATH="$PATH:$HOME/.pub-cache/bin" flutter_distributor package --platform linux --targets deb

      - name: 查找 deb 文件
        id: find_deb
        run: |
          VERSION=${{ needs.build.outputs.version }}
          DEB_PATH=$(find app/dist -name "hyx_app-$VERSION*-linux.deb" -o -name "hyx_app-*.deb" | head -1)
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT

      - name: 检查 deb 文件是否存在
        run: |
          if [[ ! -f "${{ steps.find_deb.outputs.deb_path }}" ]]; then
            echo "未找到文件: ${{ steps.find_deb.outputs.deb_path }}"
            exit 1
          fi

      - name: 上传 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: deb-arm-64-result
          path: ${{ steps.find_deb.outputs.deb_path }}

  # ─────────────────────────────────────────────────────────────
  # AppImage（ubuntu-22.04）
  # ─────────────────────────────────────────────────────────────
  build_appimage_x86_64:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 Linux
        working-directory: app
        run: flutter build linux --release

      - name: 复制编译产物到 AppDir
        run: |
          mkdir AppDir
          cp -r app/build/linux/x64/release/bundle/* AppDir/

      - name: 复制图标到 AppDir
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps
          cp app/assets/img/logo-32.png AppDir/usr/share/icons/hicolor/32x32/apps/hyx.png || true
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          cp app/assets/img/logo-128.png AppDir/usr/share/icons/hicolor/128x128/apps/hyx.png || true
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp app/assets/img/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/hyx.png || true

      - name: 复制 AppImage 配方到工作目录
        run: cp support/build/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: 构建 AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: 上传 AppImage 文件
        uses: actions/upload-artifact@v4
        with:
          name: appimage-x86-64-result
          path: ./*.AppImage

  # ─────────────────────────────────────────────────────────────
  # Windows zip（windows-latest）
  # ─────────────────────────────────────────────────────────────
  build_windows_zip_x86_64:
    needs: build
    runs-on: windows-latest

    steps:
      - name: 修复长路径问题
        run: git config --system core.longpaths true

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 Windows
        working-directory: app
        run: flutter build windows --release

      - name: 创建空 settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: 打包 zip
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "HyX-${{ needs.build.outputs.version }}-windows-x86-64.zip"

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-x86-64-result
          path: app/HyX-${{ needs.build.outputs.version }}-windows-x86-64.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────

  # Windows x86_64 exe 安装包（Inno Setup，windows-latest）
  # ─────────────────────────────────────────────────────────────
  build_windows_exe_x86_64:
    needs: build
    runs-on: windows-latest

    steps:
      - name: 修复长路径问题
        run: git config --system core.longpaths true

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 Windows
        working-directory: app
        run: flutter build windows --release

      - name: 创建空 settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 准备 Inno Setup 载荷
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      - name: 编译安装包
        run: iscc "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" "/DMyAppVersion=${{ needs.build.outputs.version }}" support\scripts\compile_windows_exe-inno.iss

      - name: 重命名安装包
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\HyX.exe" -NewName "HyX-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-x86-64-result
          path: ${{ runner.temp }}\inno-result\HyX-${{ needs.build.outputs.version }}-windows-x86-64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # macOS zip（macos-latest，universal binary）
  # ─────────────────────────────────────────────────────────────
  build_macos:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust（macOS arm64 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 macOS
        working-directory: app
        run: flutter build macos --release

      - name: 打包 zip
        run: |
          cd app/build/macos/Build/Products/Release
          zip -r ../../../../../HyX-${{ needs.build.outputs.version }}-macos.zip hyx_app.app

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-result
          path: ./app/HyX-${{ needs.build.outputs.version }}-macos.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # iOS 无签名构建验证（macos-latest）
  # ─────────────────────────────────────────────────────────────
  build_ios_no_sign:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: 安装 Rust（iOS target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 检查 rust-toolchain.toml
        working-directory: packages/hyx_isolates
        run: rustup show

      - name: 生成平台配置
        working-directory: app
        run: flutter create --platforms=linux,macos,windows,android,ios --project-name hyx_app --org com.ojbxc .

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: 生成 FRB 绑定
        working-directory: packages/hyx_isolates
        run: flutter_rust_bridge_codegen generate

      - name: 生成 i18n 代码
        working-directory: app
        run: dart run slang

      - name: 编译 iOS（无签名）
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-no-sign-result
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Linux CLI（x86_64 + arm64，matrix）
  # ─────────────────────────────────────────────────────────────
  build_cli_linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: linux-x86-64
          - runner: ubuntu-22.04-arm
            suffix: linux-arm-64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 编译 CLI
        run: cargo build --release --package hyx

      # tar 保留可执行位，直接上传 artifact 会丢失该位
      - name: 创建 tar.gz 归档
        run: tar -czvf HyX-CLI-${{ needs.build.outputs.version }}-${{ matrix.suffix }}.tar.gz -C target/release hyx

      - name: 上传 CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.suffix }}-result
          path: HyX-CLI-${{ needs.build.outputs.version }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Windows CLI exe（x86_64 + arm64，matrix）
  # ─────────────────────────────────────────────────────────────
  build_cli_windows_exe:
    needs: build
    runs-on: windows-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 编译 CLI
        run: cargo build --release --package hyx

      - name: 重命名 CLI 可执行文件
        run: Rename-Item -Path "target\release\hyx.exe" -NewName "HyX-CLI-${{ needs.build.outputs.version }}-windows-x86-64.exe"

      - name: 上传 CLI
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-exe-x86-64-result
          path: target\release\HyX-CLI-${{ needs.build.outputs.version }}-windows-x86-64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 汇总所有 artifact，创建 GitHub Release
  # ─────────────────────────────────────────────────────────────
  release:
    needs:
      - build
      - build_apk
      - build_apk_lite
      - build_tar_x86_64
      - build_tar_arm_64
      - build_deb_x86_64
      - build_deb_arm_64
      - build_appimage_x86_64
      - build_windows_zip_x86_64
      - build_windows_exe_x86_64
      - build_macos
      - build_ios_no_sign
      - build_cli_linux
      - build_cli_windows_exe
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 artifact
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: 重命名 artifact 为发布文件名
        run: |
          VERSION=${{ needs.build.outputs.version }}
          mkdir -p release-assets
          # APK（arm64，Flutter 版）
          cp all-artifacts/apk-result/app-release.apk    "release-assets/HyX-$VERSION-android-arm64v8.apk" 2>/dev/null || true
          # APK 轻量版（arm64，Kotlin + Rust JNI，无 Flutter 引擎）
          cp all-artifacts/apk-lite-result/app-release.apk "release-assets/HyX-$VERSION-android-arm64v8-lite.apk" 2>/dev/null || true
          # Linux tar.gz
          cp all-artifacts/tar-gz-x86-64-result/*.tar.gz "release-assets/HyX-$VERSION-linux-x86-64.tar.gz" 2>/dev/null || true
          cp all-artifacts/tar-gz-arm-64-result/*.tar.gz "release-assets/HyX-$VERSION-linux-arm-64.tar.gz" 2>/dev/null || true
          # Linux deb
          cp all-artifacts/deb-x86-64-result/*.deb "release-assets/HyX-$VERSION-linux-x86-64.deb" 2>/dev/null || true
          cp all-artifacts/deb-arm-64-result/*.deb "release-assets/HyX-$VERSION-linux-arm-64.deb" 2>/dev/null || true
          # AppImage
          for file in all-artifacts/appimage-x86-64-result/*.AppImage; do
            if [ -f "$file" ]; then
              cp "$file" "release-assets/HyX-$VERSION-linux-x86-64.AppImage"
            fi
          done
          # Windows zip（便携版）
          cp all-artifacts/windows-zip-x86-64-result/*.zip "release-assets/HyX-$VERSION-windows-x86-64.zip" 2>/dev/null || true
          # Windows exe 安装包
          cp all-artifacts/windows-exe-x86-64-result/*.exe "release-assets/HyX-$VERSION-windows-x86-64.exe" 2>/dev/null || true
          # macOS zip
          cp all-artifacts/macos-zip-result/*.zip "release-assets/HyX-$VERSION-macos.zip" 2>/dev/null || true
          # CLI - Linux tar.gz
          cp all-artifacts/cli-linux-x86-64-result/*.tar.gz "release-assets/HyX-CLI-$VERSION-linux-x86-64.tar.gz" 2>/dev/null || true
          cp all-artifacts/cli-linux-arm-64-result/*.tar.gz "release-assets/HyX-CLI-$VERSION-linux-arm-64.tar.gz" 2>/dev/null || true
          # CLI - Windows exe
          cp all-artifacts/windows-cli-exe-x86-64-result/*.exe "release-assets/HyX-CLI-$VERSION-windows-x86-64.exe" 2>/dev/null || true
          # 列出最终发布文件
          ls -l release-assets/

      - name: 删除旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # 参照 Lxchat build.yml：先删除旧 release 和 tag，再重新创建
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          echo "已清理旧 release: $TAG"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "HyX ${{ needs.build.outputs.tag }}"
          body: |
            ## HyX ${{ needs.build.outputs.version }}

            **极速 P2P 文件传输** — 基于 QUIC 的高速跨平台传输内核。

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Android (arm64) | `HyX-${{ needs.build.outputs.version }}-android-arm64v8.apk` |
            | Android (arm64) 轻量版 | `HyX-${{ needs.build.outputs.version }}-android-arm64v8-lite.apk` |
            | Linux x86_64    | `HyX-${{ needs.build.outputs.version }}-linux-x86-64.tar.gz` |
            | Linux arm64     | `HyX-${{ needs.build.outputs.version }}-linux-arm-64.tar.gz` |
            | Linux deb x86_64| `HyX-${{ needs.build.outputs.version }}-linux-x86-64.deb` |
            | Linux deb arm64 | `HyX-${{ needs.build.outputs.version }}-linux-arm-64.deb` |
            | Linux AppImage  | `HyX-${{ needs.build.outputs.version }}-linux-x86-64.AppImage` |
            | Windows x86_64 安装包 | `HyX-${{ needs.build.outputs.version }}-windows-x86-64.exe` |
            | Windows x86_64 便携版 | `HyX-${{ needs.build.outputs.version }}-windows-x86-64.zip` |
            | macOS           | `HyX-${{ needs.build.outputs.version }}-macos.zip` |
            | CLI Linux x86_64 | `HyX-CLI-${{ needs.build.outputs.version }}-linux-x86-64.tar.gz` |
            | CLI Linux arm64  | `HyX-CLI-${{ needs.build.outputs.version }}-linux-arm-64.tar.gz` |
            | CLI Windows x86_64 | `HyX-CLI-${{ needs.build.outputs.version }}-windows-x86-64.exe` |

            ### 特性
            - Rust 内核：QUIC 单连续流 + 断点续传 + 增量 SHA-256
            - Flutter 跨平台前端（Windows / macOS / Linux / Android / iOS）
            - 局域网自动发现、直连/配对码互传、NAT 穿透
          files: release-assets/*
          draft: false
          prerelease: false

      - name: Generate latest.json
        run: |
          VERSION=${{ needs.build.outputs.version }}
          cat > release-assets/latest.json <<JSONEOF
          {
            "version": "${VERSION}",
            "body": "HyX v${VERSION}",
            "files": {
              "android-arm64v8": "HyX-${VERSION}-android-arm64v8.apk",
              "android-arm64v8-lite": "HyX-${VERSION}-android-arm64v8-lite.apk",
              "linux-x86-64-tar": "HyX-${VERSION}-linux-x86-64.tar.gz",
              "linux-arm-64-tar": "HyX-${VERSION}-linux-arm-64.tar.gz",
              "linux-x86-64-deb": "HyX-${VERSION}-linux-x86-64.deb",
              "linux-arm-64-deb": "HyX-${VERSION}-linux-arm-64.deb",
              "linux-x86-64-appimage": "HyX-${VERSION}-linux-x86-64.AppImage",
              "windows-x86-64-exe": "HyX-${VERSION}-windows-x86-64.exe",
              "windows-x86-64-zip": "HyX-${VERSION}-windows-x86-64.zip",
              "macos": "HyX-${VERSION}-macos.zip"
            }
          }
          JSONEOF
          cat release-assets/latest.json

      - name: Upload to Cloudflare R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 上传所有 release-assets 到 R2 HyX/ 目录
          for file in release-assets/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_key=$(echo "HyX/${filename}" | sed 's/\//%2F/g')
              content_type="application/octet-stream"
              case "$filename" in
                *.apk) content_type="application/vnd.android.package-archive" ;;
                *.json) content_type="application/json" ;;
                *.zip) content_type="application/zip" ;;
                *.tar.gz) content_type="application/gzip" ;;
                *.deb) content_type="application/vnd.debian.binary-package" ;;
                *.AppImage) content_type="application/x-executable" ;;
                *.exe) content_type="application/x-msdownload" ;;
              esac
              echo "Uploading $filename..."
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/downloads/objects/${encoded_key}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: ${content_type}" \
                --data-binary @"$file"
            fi
          done
          echo "Uploaded all assets to Cloudflare R2 HyX/"
