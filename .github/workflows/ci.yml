name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # 与 .fvmrc、app/pubspec.yaml 保持一致
  FLUTTER_VERSION: "3.41.9"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Dart 代码格式检查（app）
  # ─────────────────────────────────────────────────────────────
  format:
    name: Dart — format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 依赖 (app)
        working-directory: app
        run: flutter pub get

      - name: 检查格式 (app)
        working-directory: app
        run: dart format --set-exit-if-changed lib test

  # ─────────────────────────────────────────────────────────────
  # Flutter analyze + test（app 与 hyx_isolates）
  # ─────────────────────────────────────────────────────────────
  test:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 依赖 (app)
        working-directory: app
        run: flutter pub get
      - name: Analyze (app)
        working-directory: app
        run: flutter analyze
      - name: Test (app)
        working-directory: app
        run: flutter test

      - name: 依赖 (hyx_isolates)
        working-directory: packages/hyx_isolates
        run: flutter pub get
      - name: Test (hyx_isolates)
        working-directory: packages/hyx_isolates
        run: flutter test

  # ─────────────────────────────────────────────────────────────
  # Rust — clippy/test core，check plugin/cli/rendezvous/mobile
  # 保留原有 workspace 级别的 fmt/clippy/test 逻辑
  # ─────────────────────────────────────────────────────────────
  rust:
    name: Rust — build, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: Fmt
        run: cargo fmt --all -- --check

      # core 是 P2P 传输内核，运行完整 clippy + test
      - name: Clippy (core)
        run: cargo clippy -p hyx-core --all-targets -- -D warnings
      - name: Test (core)
        run: cargo test -p hyx-core

      # 其余 crate 仅做 check（plugin/cli/rendezvous/mobile）
      - name: Check (plugin / cli / rendezvous / mobile)
        run: cargo check -p rust_lib_hyx_app -p hyx-cli -p hyx-rendezvous -p hyx-mobile

  # ─────────────────────────────────────────────────────────────
  # 版本一致性检查：app/pubspec.yaml vs cli/Cargo.toml
  # ─────────────────────────────────────────────────────────────
  packaging:
    name: Packaging — version consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 从 pubspec.yaml 提取版本
        run: |
          VERSION=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | sed 's/\+.*//')
          echo "pubspec 版本为 $VERSION"
          echo "pubspec_version=$VERSION" >> $GITHUB_ENV

      - name: 从 cli/Cargo.toml 提取版本
        run: |
          VERSION=$(grep '^version = ' cli/Cargo.toml | sed 's/version = "//' | sed 's/"//')
          echo "CLI 版本为 $VERSION"
          echo "cli_version=$VERSION" >> $GITHUB_ENV

      - name: 比对 pubspec 与 CLI 版本
        run: |
          if [ "$pubspec_version" != "$cli_version" ]; then
            echo "检测到版本不一致！pubspec=$pubspec_version, cli=$cli_version"
            exit 1
          else
            echo "版本一致：$pubspec_version"
          fi
