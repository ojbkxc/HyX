# HyX — 统一极速传输内核
# 构建：cargo build --release（默认 CLI，约 ~3 MB）

[package]
name = "hyx"
version = "0.1.0"
edition = "2021"
authors = ["ojbkxc"]
description = "HyX: 极速 P2P 文件传输内核（QUIC 单连续流 + 断点续传，Rust 实现）"
license = "MIT"
repository = "https://github.com/ojbkxc/HyX"
keywords = ["p2p", "file-transfer", "quic", "networking"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
members = ["core", "cli", "rendezvous", "mobile"]

[dependencies]
hyx-core = { path = "./core" }
hyx-cli = { path = "./cli", optional = true }

anyhow = "1.0"

[dev-dependencies]
hyx-core = { path = "./core" }
hyx-cli = { path = "./cli" }
hyx-rendezvous = { path = "./rendezvous" }
tokio = { version = "1.40", features = ["full"] }
tempfile = "3.12"
sha2 = "0.10"

[features]
# 默认：仅 CLI（小体积）
default = ["cli"]
cli = ["hyx-cli"]
# GUI 已移除（上游为 Iced）。声明该 feature 仅为让 main.rs 的
# `#[cfg(feature = "gui")]` 脚手架在 `-D warnings` 下通过编译。
gui = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"