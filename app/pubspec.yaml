name: hyx_app
description: HyX — 极速 P2P 文件传输（Flutter 跨平台前端）
homepage: https://github.com/ojbkxc/HyX
publish_to: "none"
resolution: workspace

version: 1.0.2+1

environment:
  flutter: ^3.41.0
  sdk: ^3.11.0

dependencies:
  device_info_plus: 12.4.0
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: ^2.12.0
  http: ^1.2.0
  hyx_isolates:
    path: ../packages/hyx_isolates
  intl: ^0.20.2
  logging: 1.3.0
  meta: ^1.17.0
  path: 1.9.1
  path_provider: 2.1.6
  refena_flutter: 3.5.0
  shared_preferences: 2.5.5
  slang: 4.19.0
  slang_flutter: 4.19.0
  uuid: 4.6.0
  window_manager: 0.5.2

dev_dependencies:
  build_runner: 2.15.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  slang_build_runner: 4.19.0
  test: ^1.30.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/